
services:
  neo4j:
    image: neo4j:5.22.0-community
    container_name: t2g-neo4j
    restart: always

    environment:
      # --- Authentication ---
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}

      # --- Memory configuration ---
      - NEO4J_server_memory_heap_initial__size=${NEO4J_server_memory_heap_initial__size}
      - NEO4J_server_memory_heap_max__size=${NEO4J_server_memory_heap_max__size}
      - NEO4J_server_memory_pagecache_size=${NEO4J_server_memory_pagecache_size}

      # --- Plugins and APOC ---
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_security_procedures_whitelist=apoc.*

      # --- Basic network config ---
      - NEO4J_server_bolt_advertised__address=localhost:7687
      - NEO4J_server_http_advertised__address=localhost:7474

    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"

    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./import:/var/lib/neo4j/import
      - ./plugins:/plugins